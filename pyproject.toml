[project]
name = "enforce-rules"
version = "1.0.0"
description = "Runtime rule validation for Python using dictionary-based constraints."
readme = { file = "README.md" }
requires-python = ">=3.10"
license = { file = "LICENSE", text = "BSD-3-Clause" }
authors = [
    { name = "Jake Loepker" },
    { name = "Microsoft Copilot (AI Assistant)", url = "https://copilot.microsoft.com" }
]


classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/Loepker-James/enforce-rules"
Issues = "https://github.com/Loepker-James/enforce-rules/issues"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

