[project]
name = "enforce-rules"
version = "3.3.1"
description = "Runtime rule validation for Python using dictionary-based constraints."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-chess>=1.11",
    "pydantic>=2",
]
license = { file = "LICENSE" }
authors = [
    { name = "Jake Loepker" },
    { name = "Microsoft Copilot (AI Assistant)" }
]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
    "Typing :: Typed"
]

[project.urls]
Homepage = "https://github.com/Loepker-James/enforce-rules"
Issues = "https://github.com/Loepker-James/enforce-rules/issues"
Changelog = "https://github.com/Loepker-James/enforce-rules/blob/main/CHANGELOG.md"
Copilot = "https://copilot.microsoft.com"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
enforce_rules = ["py.typed", "*.pyi"]



