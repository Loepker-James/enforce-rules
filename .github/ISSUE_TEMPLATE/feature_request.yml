name: New keyword or feature
description: Suggest a new rule keyword or an improvement
title: "Feature: "
labels: "enhancement"
body:
  - type: markdown
    attributes:
      value: |
        Thanks for trying to contribute to PER! All contributions are welcome.

        Existing keywords keep behaving exactly as they do now. If you want different behavior, propose a new keyword and explain how it differs from the existing one, e.g. `min_exclusive`.
  - type: input
    id: keyword
    attributes:
      label: Proposed keyword name
      description: Leave blank if this is not a new keyword.
      placeholder: "no_whitespace"
  - type: textarea
    id: what
    attributes:
      label: What should it do?
      description: Describe what it checks and when it should fail.
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Example usage
      description: How you would use it.
      render: python
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
      description: Paste the code you use today, such as a `must_be_true` function. If you have no workaround, leave this field blank.
      render: python
  - type: checkboxes
    id: compatibility
    attributes:
      label: Backward compatibility
      options:
        - label: This would not change what any existing keyword does or how it behaves. If its purpose is different behavior when ticked (e.g. `min_exclusive`), it would be a new keyword and backwards compatible.
          required: true
