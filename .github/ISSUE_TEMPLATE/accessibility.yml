name: Accessibility problem
description: Report something that is hard to read, navigate, or use
title: "Accessibility: "
labels: "accessibility"
assignees: "Loepker-James"
body:
  - type: markdown
    attributes:
      value: |
        Thank you for telling us. You do not need to share anything about yourself, and every field except the first two is optional. Screenshots or recordings are welcome but never required.
  - type: textarea
    id: task
    attributes:
      label: What were you trying to do?
      description: For example, read a section of the README, follow a link, or understand an error message.
    validations:
      required: true
  - type: textarea
    id: barrier
    attributes:
      label: What got in the way?
      description: Describe what happened, in your own words.
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where did it happen?
      description: A link to the page or file, or anything else that shows where the accessibility problem happened. Leave this empty if you do not have one.
  - type: input
    id: environment
    attributes:
      label: Browser, operating system, or assistive technology
      description: Only if you want to share it.
  - type: textarea
    id: suggestion
    attributes:
      label: What would make it easier?
